<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#070a12">
  <meta name="description" content="Public Live Spectator Map - Racemap Ultra Live Race Tracking">
  
  <title>RACEMAP ULTRA - Live Spectator Race Map</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='100' fill='%230b0f19'/><path d='M256 96c-70.7 0-128 57.3-128 128 0 88 128 224 128 224s128-136 128-224c0-70.7-57.3-128-128-128zm0 176c-26.5 0-48-21.5-48-48s21.5-48 48-48 48 21.5 48 48-21.5 48-48 48z' fill='%2300f2fe'/><circle cx='256' cy='224' r='24' fill='%23ffffff'/></svg>">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <link rel="stylesheet" href="./src/styles/main.css">
</head>
<body>

  <!-- Top Navigation Header for Public Spectator -->
  <header class="navbar">
    <div class="brand">
      <div class="brand-icon">⚡</div>
      <div>
        <span class="brand-title">RACEMAP ULTRA</span>
        <span class="mode-badge" id="event-mode-badge">PUBLIC MAP</span>
      </div>
    </div>

    <!-- Navigation Links -->
    <div style="display:flex; align-items:center; gap:0.5rem;">
      <a href="/tracker" class="tab-btn" style="text-decoration:none;">
        <span>📱</span>
        <span class="tab-text">Rider Tracker</span>
      </a>
      <a href="/admin" class="tab-btn" style="text-decoration:none;">
        <span>⚙️</span>
        <span class="tab-text">Admin</span>
      </a>
    </div>
  </header>

  <!-- PUBLIC SPECTATOR LIVE MAP VIEW -->
  <main id="view-spectator" class="view-container active">
    <div class="map-layout">
      <div id="leaflet-map"></div>

      <!-- Floating Tile Controls & Sidebar Toggle -->
      <div class="map-tile-controls">
        <button class="tile-btn active" data-tile="dark">Dark</button>
        <button class="tile-btn" data-tile="satellite">Satellite</button>
        <button class="tile-btn" data-tile="topo">Terrain</button>
        <button id="btn-toggle-sidebar" class="tile-btn" style="background:rgba(56,189,248,0.15); color:var(--primary); font-weight:700;">
          ◀ Sidebar
        </button>
      </div>

      <!-- Spectator Floating Stats -->
      <div class="spectator-stats-overlay">
        <div class="stat-box">
          <span class="label">Peserta Aktif</span>
          <span class="value" id="stat-active-riders">0 / 0</span>
        </div>
        <div class="stat-box" style="border-left: 1px solid rgba(255,255,255,0.08); padding-left: 0.6rem;">
          <span class="label">Lead KM</span>
          <span class="value" id="stat-leader-km">0.0 KM</span>
        </div>
        <div class="stat-box" style="border-left: 1px solid rgba(255,255,255,0.08); padding-left: 0.6rem;">
          <span class="label">Avg Spd</span>
          <span class="value" id="stat-avg-speed">0.0 km/h</span>
        </div>
      </div>

      <!-- Mobile Floating Drawer Triggers -->
      <div class="mobile-map-triggers">
        <button id="btn-mobile-leaderboard" class="btn-mobile-trigger">🏆 Leaderboard</button>
        <button id="btn-mobile-elevation" class="btn-mobile-trigger">⛰️ Elevation</button>
      </div>

      <!-- Leaderboard Sidebar / Drawer (Collapsible) -->
      <aside class="leaderboard-drawer" id="leaderboard-drawer">
        <div class="drawer-header">
          <div class="drawer-title">
            <span>🏆 LEADERBOARD RACE</span>
            <button id="btn-close-sidebar-x" style="background:none; border:none; color:var(--text-muted); font-size:1.1rem; cursor:pointer; padding:0 0.3rem;">✕</button>
          </div>

          <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="search-rider" placeholder="Cari Peserta / BIB #...">
          </div>

          <div class="cat-filters">
            <button class="cat-chip active" data-cat="ALL">Semua</button>
            <button class="cat-chip" data-cat="SOLO">Solo</button>
            <button class="cat-chip" data-cat="PAIR">Pair</button>
            <button class="cat-chip" data-cat="RELAY">Relay</button>
          </div>
        </div>

        <div class="rider-list" id="rider-leaderboard-list">
          <div style="text-align:center; padding:1.5rem; color:#64748b; font-size:0.75rem;">
            Belum ada data peserta terdaftar
          </div>
        </div>
      </aside>
    </div>

    <!-- Bottom Elevation Bar -->
    <section class="elevation-profile-bar" id="elevation-profile-bar">
      <div class="elevation-header">
        <span class="elevation-title">⛰️ Profil Ketinggian Rute</span>
        <span id="route-distance-text" style="font-size:0.7rem; color:var(--primary); font-weight:600;">-- KM</span>
      </div>
      <div class="chart-container">
        <canvas id="elevation-chart"></canvas>
      </div>
    </section>
  </main>

  <div id="toast-container" class="toast-container"></div>

  <script type="module" src="./src/js/spectator.js"></script>
</body>
</html>
